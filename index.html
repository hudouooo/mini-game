<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成大乐喵</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{--page:#eaf4ee;--dot:#f6dfe8;--ink:#7a5640;--paper:#fff7ef;--pink:#f7d3df;--mint:#d6eee0;--lav:#e4dcf4;--butter:#fcefc4;--danger:#ef8d9a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#4a3c42;--dot:#5a4850;--ink:#fbe9dc}}
:root[data-theme="dark"]{--page:#4a3c42;--dot:#5a4850;--ink:#fbe9dc}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);
font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--page);
background-image:radial-gradient(var(--dot) 3px,transparent 3.5px);background-size:26px 26px;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.top{display:flex;gap:10px;align-items:stretch;width:var(--bw)}
.chip{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:4px 12px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.chip small{font-size:12px;opacity:.75}.chip b{font-size:24px;font-weight:400}
#nextBox{flex:0 0 66px;align-items:center}.ib{flex:0 0 44px;align-items:center;cursor:pointer}#sndImg{height:24px;width:auto}
#nextImg{height:34px;max-width:60px;object-fit:contain}
#board{position:relative;width:var(--bw);aspect-ratio:440/680;border:5px solid var(--ink);border-radius:22px;overflow:hidden;
background-color:var(--paper);background-image:linear-gradient(90deg,rgba(247,190,210,.42) 50%,transparent 50%),linear-gradient(rgba(247,190,210,.42) 50%,transparent 50%);background-size:9.1% 5.9%}
canvas{position:absolute;inset:0;width:100%;height:100%}
#chain{display:flex;align-items:center;gap:3px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;width:var(--bw);justify-content:space-between}
#chain img{height:calc(var(--bw)*.075);width:calc(var(--bw)*.095);object-fit:contain}#chain i{font-style:normal;font-size:11px;opacity:.6}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,247,239,.8);text-align:center;padding:16px;overflow:hidden}
#ov.show{display:flex}#ov,#ov #again,.chip,#chain{color:#7a5640}
#ovImg{width:62%;max-height:40%;object-fit:contain;transform:translateY(130%);opacity:0}
#ov.show #ovImg{animation:rise 2.6s cubic-bezier(.2,.8,.25,1) forwards}
#ovTxt{font-size:clamp(20px,6vw,28px);line-height:1.35;opacity:0}
#ovScore{font-size:20px;line-height:1.4;opacity:0}#ovScore b{font-weight:400;font-size:30px}#ovScore small{font-size:15px;opacity:.75}.nr{display:inline-block;background:var(--pink);border:2px solid #7a5640;border-radius:999px;padding:0 10px;font-size:18px;color:#c2506b;transform:rotate(-4deg)}
#ov.show #ovTxt,#ov.show #ovScore{animation:fade 1s 2.2s forwards}
#again{font:inherit;font-size:20px;color:var(--ink);background:var(--butter);border:3px solid var(--ink);border-radius:999px;padding:6px 26px;cursor:pointer;opacity:0;pointer-events:none}
#ov.show #again{animation:fade 1s 2.8s forwards;pointer-events:auto}
@keyframes rise{to{transform:translateY(0);opacity:1}}@keyframes fade{to{opacity:1}}
#toast{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;text-align:center;z-index:2;color:#7a5640}
#toast.show{display:flex}
#pz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,247,239,.7);z-index:3;color:#7a5640}
#pz.show{display:flex}
.pbox{position:relative;margin-top:110px;width:76%;background:#fff7ef;border:3px solid #7a5640;border-radius:22px;padding:56px 14px 16px;text-align:center;box-shadow:0 6px 0 rgba(122,86,64,.25)}
#pzImg{position:absolute;left:50%;top:0;width:44%;transform:translate(-50%,-88%)}
.pt{font-size:28px}.ps{font-size:16px;opacity:.8;margin:2px 0 12px}
.pb{display:flex;gap:10px}.pb button{flex:1;font:inherit;font-size:18px;color:#7a5640;background:#fcefc4;border:3px solid #7a5640;border-radius:999px;padding:6px 4px;cursor:pointer}#pzEnd{background:#f7d3df}
#tImg{width:50%;max-height:34%;object-fit:contain;transform:translateY(160%);opacity:0}
#toast.show #tImg{animation:trise 5.5s cubic-bezier(.2,.8,.25,1) forwards}
#tTxt{font-size:clamp(20px,6vw,28px);line-height:1.35;background:rgba(255,247,239,.88);border:3px solid #7a5640;border-radius:18px;padding:6px 16px;opacity:0}
#toast.show #tTxt{animation:tfade 5.5s forwards}
@keyframes trise{0%{transform:translateY(160%);opacity:0}12%{opacity:1}45%,80%{transform:translateY(0);opacity:1}100%{transform:translateY(-10%);opacity:0}}
@keyframes tfade{0%,35%{opacity:0}45%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#ov.show #ovImg,#ov.show #ovTxt,#ov.show #ovScore,#ov.show #again{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div class="top"><div class="chip"><small>得分</small><b id="score">0</b></div><div class="chip"><small>最高分</small><b id="best">0</b></div><div class="chip" id="nextBox"><small>下一个</small><img id="nextImg" alt=""></div><div class="chip ib" id="snd" role="button" aria-label="音效开关"><img id="sndImg" alt=""></div><div class="chip ib" id="pauseBtn" role="button" aria-label="暂停"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="3" width="6" height="18" rx="2" fill="#eaa8b4" stroke="#5e3d1f" stroke-width="2.4"/><rect x="14" y="3" width="6" height="18" rx="2" fill="#eaa8b4" stroke="#5e3d1f" stroke-width="2.4"/></svg></div></div>
<div id="board"><canvas id="cv"></canvas>
<div id="toast"><img id="tImg" alt=""><div id="tTxt">乐喵的计数方式：<br>1+1=0</div></div>
<div id="pz"><div class="pbox"><img id="pzImg" alt=""><div class="pt">游戏暂停</div><div class="ps" id="pzScore"></div><div class="pb"><button id="pzEnd">立即结算</button><button id="pzGo">继续游戏</button></div></div></div>
<div id="ov"><img id="ovImg" alt=""><div id="ovTxt"></div><div id="ovScore"></div><button id="again">再玩一次</button></div></div>
<div id="chain"></div>

$('snd').addEventListener('click',()=>{mute=!mute;$('sndImg').src=mute?SND_OFF:SND_ON;if(!mute){ac();sfxMerge(3)}});
let pauseAt=0;
function pause(){if(state!=='play')return;state='paused';pauseAt=performance.now();$('pzImg').src=SPR[4].src;$('pzScore').textContent='当前得分 '+score;$('pz').classList.add('show')}
function resume(){if(state!=='paused')return;const d=performance.now()-pauseAt;if(overT!==null)overT+=d;lastDrop+=d;for(const b of bodies)b.born+=d;state='play';$('pz').classList.remove('show')}
$('pauseBtn').addEventListener('click',pause);$('pzGo').addEventListener('click',resume);$('pzEnd').addEventListener('click',()=>{$('pz').classList.remove('show');finish(false)});
function toast(){const t=$('toast');t.classList.remove('show');void t.offsetWidth;$('tImg').src=SPR[3].src;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5600)}
function fit(){const w=Math.max(220,Math.min(innerWidth-20,(innerHeight-200)*W/H,460));document.documentElement.style.setProperty('--bw',w+'px');
 const d=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(w*d);cv.height=Math.round(w*H/W*d);}
addEventListener('resize',fit);fit();
$('chain').innerHTML=imgs.map((_,i)=>'<img src="'+SPR[i].src+'" alt="">'+(i<6?'<i>›</i>':'')).join('');
let best=0;try{best=+localStorage.getItem('lemiao-best')||0}catch(e){}
$('best').textContent=best;
let engine,bodies,queue,parts,score,cur,nxt,x,state,lastDrop,overT,t0,popT;
let prevBest=0,sevenPair=null;
let gen=0,run3=0;
function rnd(){const n=gen++;let l;do{l=1+Math.floor(Math.random()*(n<5?2:3))}while(l===3&&run3>=2);run3=l===3?run3+1:0;return l}
function mk(l,px,py){const s=SPR[l-1];const b=Bodies.fromVertices(0,0,[s.hull.map(p=>({x:p[0],y:p[1]}))],{friction:.35,restitution:.5,frictionAir:.008,density:.001,slop:.04});
 Body.setPosition(b,{x:px,y:py});b.level=l;b.born=performance.now();b.pop=0;return b}
function halfW(l){return Math.max(...SPR[l-1].hull.map(p=>Math.abs(p[0])))}
function reset(){engine=Engine.create({positionIterations:10,velocityIterations:8});engine.gravity.y=1.1;
 const o={isStatic:true,friction:.4};World.add(engine.world,[Bodies.rectangle(W/2,H+30,W+200,60,o),Bodies.rectangle(-30,H/2,60,H*3,o),Bodies.rectangle(W+30,H/2,60,H*3,o)]);
 bodies=[];queue=[];parts=[];score=0;gen=0;run3=0;prevBest=best;sevenPair=null;cur=rnd();nxt=rnd();x=W/2;state='play';lastDrop=0;overT=null;popT=0;
 Events.on(engine,'collisionStart',e=>{for(const p of e.pairs){const a=p.bodyA,b=p.bodyB;const v=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);if(v>2.5){if(a.level)a.sq=Math.min(1,v/12);if(b.level)b.sq=Math.min(1,v/12)}
  if(v>2&&!(a.level&&a.level===b.level&&a.level<MAXL)){const now=performance.now();if(now-lastBoing>130){lastBoing=now;sfxBoing(Math.max(a.level||0,b.level||0)||1,Math.min(1,v/12))}}if(a.level===MAXL&&b.level===MAXL)sevenPair=[a,b];if(a.level&&a.level===b.level&&a.level<MAXL&&!a.mg&&!b.mg){a.mg=b.mg=true;queue.push([a,b])}}});
 Events.on(engine,'collisionActive',e=>{for(const p of e.pairs)if(p.bodyA.level===MAXL&&p.bodyB.level===MAXL)sevenPair=[p.bodyA,p.bodyB]});
 $('score').textContent=0;$('ov').classList.remove('show');$('toast').classList.remove('show');$('pz').classList.remove('show');$('nextImg').src=SPR[nxt-1].src}
function add(l,px,py){const b=mk(l,px,py);World.add(engine.world,b);bodies.push(b);return b}
function burst(px,py,l){const c=['#f7b6c8','#fbe29a','#b9e3cf','#c9bdf0','#bfe0f5'];for(let i=0;i<8+l*2;i++){const a=Math.random()*6.28,v=1.5+Math.random()*3;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c:c[i%5],r:3+Math.random()*4})}}
function drop(){if(state!=='play'||performance.now()-lastDrop<650)return;lastDrop=performance.now();
 const hw=halfW(cur);const b=add(cur,Math.min(W-hw-4,Math.max(hw+4,x)),SPY);b.fresh=true;cur=nxt;nxt=rnd();$('nextImg').src=SPR[nxt-1].src}
function setX(e){const r=cv.getBoundingClientRect();x=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{ac();cv.setPointerCapture(e.pointerId);setX(e)});
cv.addEventListener('pointermove',setX);
cv.addEventListener('pointerup',e=>{setX(e);drop()});
function addScore(l,pts){score+=pts??(l-1)*l/2;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('lemiao-best',best)}catch(e){}}}
function finish(win){state=win?'won':'lost';const i=win?4:1;$('ovImg').src=SPR[i-1].src;
 $('ovTxt').innerHTML=win?'乐喵的计数方式：<br>1+1=0':'Game Over!';
 $('ovScore').innerHTML='本局得分 <b>'+score+'</b>'+(score>prevBest&&score>0?' <span class="nr">新纪录！</span>':'')+'<br><small>历史最高 '+best+'</small>';setTimeout(()=>$('ov').classList.add('show'),win?600:200)}
function step(){sevenPair=null;Engine.update(engine,1000/60);
 for(const [a,b] of queue){if(!bodies.includes(a)||!bodies.includes(b))continue;const l=a.level+1,mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;
  World.remove(engine.world,[a,b]);bodies=bodies.filter(q=>q!==a&&q!==b);const n=add(l,mx,my);n.pop=1;n.fresh=false;Body.setAngle(n,a.angle);burst(mx,my,l);addScore(l);sfxMerge(l)}
 queue=[];
 if(state==='play'){if(sevenPair){const [a,b]=sevenPair;if(bodies.includes(a)&&bodies.includes(b)&&bodies.filter(q=>q.level===MAXL).length>=3){burst((a.position.x+b.position.x)/2,(a.position.y+b.position.y)/2,MAXL);World.remove(engine.world,[a,b]);bodies=bodies.filter(q=>q!==a&&q!==b);addScore(0,42);sfxBoom();toast();return}}
  const now=performance.now();let over=false;
  for(const b of bodies){if(b.fresh&&now-b.born>1500)b.fresh=false;if(!b.fresh&&b.bounds.min.y<LINE)over=true}
  if(over){if(overT===null)overT=now;if(now-overT>5000){finish(false)}}else overT=null}}
function draw(){const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
 ctx.strokeStyle=overT!==null?'#ef8d9a':'rgba(239,141,154,.7)';ctx.lineWidth=3;ctx.setLineDash([12,9]);ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
 if(overT!==null&&state==='play'){const s=Math.max(0,Math.ceil(5-(performance.now()-overT)/1000));ctx.font='22px "ZCOOL KuaiLe",sans-serif';ctx.fillStyle='#e0707f';ctx.textAlign='left';ctx.fillText('快降下来！'+s,10,LINE-8)}
 for(const b of bodies){const s=SPR[b.level-1];ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  if(b.pop>0){const z=1+.22*Math.sin(b.pop*3.14);ctx.scale(z,z);b.pop=Math.max(0,b.pop-.05)}
  if(b.sq>0){const w=.2*b.sq*Math.sin(b.sq*16);ctx.scale(1+w,1-w);b.sq=Math.max(0,b.sq-.035)}
  ctx.drawImage(imgs[b.level-1],-s.cx,-s.cy,s.dw,s.dh);ctx.restore()}
 if(state==='play'){const s=SPR[cur-1],hw=halfW(cur),px=Math.min(W-hw-4,Math.max(hw+4,x));
  ctx.strokeStyle='rgba(122,86,64,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,SPY);ctx.lineTo(px,H);ctx.stroke();
  if(performance.now()-lastDrop>650){ctx.drawImage(imgs[cur-1],px-s.cx,SPY-s.cy,s.dw,s.dh)}}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l,0,6.28);ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.03}
 ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0)}
let acc=0,prev=performance.now();
function loop(t){acc+=Math.min(50,t-prev);prev=t;while(acc>=1000/60){if(state==='play'||state==='lost'||state==='won')step();acc-=1000/60}draw();requestAnimationFrame(loop)}
$('again').addEventListener('click',()=>{reset()});
reset();requestAnimationFrame(loop);
</script>
